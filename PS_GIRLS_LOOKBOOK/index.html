<title>P.S. from Aéropostale: The Girls' Spring 2016 Lookbook</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; background: #fff; }
  body { font-family: Helvetica, Arial, sans-serif; color: #111; -webkit-font-smoothing: antialiased; }
  @media (min-width: 980px) { html, body { background: #f4f4f2; } body { padding: 40px 24px; } }

  .wrap { container-type: inline-size; width: 100%; max-width: 960px; margin: 0 auto; padding-bottom: 22px; background: #fff; }
  @media (min-width: 980px) { .wrap { padding: 24px 24px 22px; box-shadow: 0 2px 24px rgba(0,0,0,.08); } }
  .credit { text-align: center; font-size: 11px; color: #888; margin: 16px 16px 0; }

  /* The stage: sky held still behind the page (as in the original), the collage, and the doodle animations */
  .stage { position: relative; aspect-ratio: 1080 / 4000; overflow: hidden; background: #fff url(img/sky.jpg) center top / 335vw auto no-repeat fixed; }
  .stage img { position: absolute; display: block; height: auto; pointer-events: none; }
  .stage .body { inset: 0; width: 100%; }

  /* Phone: the collage seen through windows, one photo or copy panel at a time */
  .full { display: none; }
  .win { position: relative; overflow: hidden; }
  .win + .win { margin-top: 6px; }
  .livecopy { margin: 0; padding: 34px 12px 30px; text-align: center; font-family: "Bodoni Moda", "Didot", "Bodoni 72", Georgia, serif; font-weight: 500; font-size: 19px; line-height: 1.3; color: #fb4d8e; }
  .win .stage { position: absolute; width: var(--sw); left: var(--sx); top: var(--sy); }

  /* Wider: the whole collage */
  @container (min-width: 760px) {
    .wins { display: none; }
    .full { display: block; }
    .full .stage { background-size: calc(100cqw * 1.389) auto; }
  }
</style>
</head>
