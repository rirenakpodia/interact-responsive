<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aéropostale: Homepage Carousel</title>
<!-- Gotham via Rire's Adobe Fonts web projects "interact-responsive (Gotham)" and "(Gotham Light)" -->
<link rel="stylesheet" href="https://use.typekit.net/sza7zys.css">
<link rel="stylesheet" href="https://use.typekit.net/txx6mha.css">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; background: #fff; }
  body { font-family: "gotham", Helvetica, Arial, sans-serif; color: #000; -webkit-font-smoothing: antialiased; }
  @media (min-width: 980px) { html, body { background: #f4f4f2; } body { padding: 40px 24px; } }

  .wrap { container-type: inline-size; width: 100%; max-width: 960px; margin: 0 auto; padding-bottom: 22px; background: #fff; }
  @media (min-width: 980px) { .wrap { padding: 24px 24px 22px; box-shadow: 0 2px 24px rgba(0,0,0,.08); } }
  .credit { text-align: center; font-size: 11px; color: #888; margin: 16px 16px 0; }

  .viewport { position: relative; }
  .slide h2 { font-weight: 400; letter-spacing: .06em; text-transform: uppercase; text-align: center; margin: 22px 16px 14px; font-size: 19px; }
  .tiles { display: grid; grid-auto-flow: column; grid-auto-columns: 74%; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; padding: 0 16px 6px; scroll-padding: 0 16px; scrollbar-width: none; overscroll-behavior-x: contain; }
  .tiles::-webkit-scrollbar { display: none; }
  .tile { scroll-snap-align: start; margin: 0; }
  .tile img { display: block; width: 100%; height: auto; aspect-ratio: 330 / 400; background: #eee; }
  .tile h3 { font-weight: 700; text-transform: uppercase; text-align: center; margin: 14px 0 0; font-size: 19px; }
  .tile p { font-family: "gotham-light", "gotham", Helvetica, Arial, sans-serif; font-weight: 300; text-transform: uppercase; text-align: center; color: #888; margin: 12px 8px 0; font-size: 13px; line-height: 1.35; }
  .nav { display: none; }

  /* Wider: the original two-slide carousel */
  @container (min-width: 760px) {
    .viewport { overflow: hidden; }
    .track { display: flex; transition: transform .5s ease; }
    .slide { flex: 0 0 100%; }
    .slide h2 { font-size: 2.2cqi; letter-spacing: .04em; margin: 2.6cqi 0 2.2cqi; }
    .tiles { grid-auto-flow: row; grid-template-columns: repeat(3, 1fr); gap: 4.17%; overflow: visible; padding: 0; }
    .tile h3 { font-size: 2.2cqi; margin-top: 1.9cqi; }
    .tile p { font-size: 1.3cqi; margin: 1.6cqi 1.4cqi 0; }
    .nav { display: flex; justify-content: center; align-items: center; gap: 16px; margin-top: 16px; }
    .arrow { display: grid; place-items: center; width: 34px; height: 34px; padding: 0 0 3px; border-radius: 50%; border: 1px solid #d6d6d6; background: #fff; font-size: 22px; line-height: 1; color: #111; cursor: pointer; transition: border-color .2s; }
    .arrow:hover { border-color: #111; }
    .dots { display: flex; justify-content: center; gap: 8px; }
    .dots button { width: 8px; height: 8px; padding: 0; border: 0; border-radius: 4px; background: #c8c8c8; cursor: pointer; transition: width .25s, background .25s; }
    .dots button.on { width: 22px; background: #111; }
  }
  @media (prefers-reduced-motion: reduce) { .track { transition: none; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="viewport">
    <div class="track">
      <section class="slide">
        <h2>Our Best Prices</h2>
        <div class="tiles">
          <figure class="tile"><img src="img/tees.jpg" alt="Girl in a navy tee and white shorts at the beach"><h3>Tees + Tanks</h3></figure>
          <figure class="tile"><img src="img/shorts.jpg" alt="Guys' shorts in mint, navy, pink and khaki: The Long and Short of It"><h3>Guy Shorts</h3></figure>
          <figure class="tile"><img src="img/swim.jpg" alt="Woman in a colorblock bikini in the water"><h3>Swim</h3></figure>
        </div>
      </section>
      <section class="slide">
        <h2>Other Ways to Shop</h2>
        <div class="tiles">
          <figure class="tile"><img src="img/borrowed.jpg" alt="Borrowed from the Boys: floral hoodie"><p>What's better than stealing his favorite hoodie? Claiming it for yourself.</p></figure>
          <figure class="tile"><img src="img/scene.jpg" alt="Scene Stealers: three friends in spring styles"><p>Our newest spring styles, fresh out of the design studio and out in the world.</p></figure>
          <figure class="tile"><img src="img/inaero.jpg" alt="#InAero heart-shaped beach photo"><p>Wear it. Share it. Shop our Instagram faves!</p></figure>
        </div>
      </section>
    </div>
  </div>
  <div class="nav"><button class="arrow prev" aria-label="Previous">&#8249;</button><div class="dots"><button class="on" aria-label="Our Best Prices"></button><button aria-label="Other Ways to Shop"></button></div><button class="arrow next" aria-label="Next">&#8250;</button></div>
  <p class="credit"><a href="https://riredesign.com/interactive" target="_top" style="color:inherit;text-decoration:none">Creative and art direction. Originally designed and built for Aéropostale.</a></p>
</div>
<script>
  // Desktop: two slides that alternate every 2.5 seconds until someone takes over
  const wrap = document.querySelector(".wrap");
  const track = document.querySelector(".track"), dots = [...document.querySelectorAll(".dots button")];
  let idx = 0, timer;
  function go(i) {
    idx = (i + 2) % 2;
    track.style.transform = wrap.clientWidth < 760 ? "" : `translateX(${-idx * 100}%)`;
    dots.forEach((d, k) => d.classList.toggle("on", k === idx));
  }
  const stop = () => clearInterval(timer);
  timer = setInterval(() => go(idx + 1), 2500);
  document.querySelector(".prev").onclick = () => { stop(); go(idx - 1); };
  document.querySelector(".next").onclick = () => { stop(); go(idx + 1); };
  dots.forEach((d, k) => d.onclick = () => { stop(); go(k); });

  // On phones the slides stack, so drop the transform
  new ResizeObserver(() => go(idx)).observe(wrap);

  const report = () => parent !== window && parent.postMessage({ type: "lookbook-height", height: document.documentElement.scrollHeight }, "*");
  new ResizeObserver(report).observe(document.body);
</script>
</body>
</html>
