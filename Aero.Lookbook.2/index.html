<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aéropostale: Bethany Mota Collection</title>
<!-- Gotham via Rire's Adobe Fonts web project "interact-responsive (Gotham)" -->
<link rel="stylesheet" href="https://use.typekit.net/sza7zys.css">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; background: #fff; }
  body { font-family: "gotham", Helvetica, Arial, sans-serif; color: #111; -webkit-font-smoothing: antialiased; }
  @media (min-width: 900px) { html, body { background: #f4f4f2; } body { padding: 40px 24px; } }

  .lookbook { container-type: inline-size; width: 100%; max-width: 960px; margin: 0 auto; padding-bottom: 20px; }
  @media (min-width: 900px) { .lookbook { background: #fff; padding: 24px 24px 18px; box-shadow: 0 2px 24px rgba(0,0,0,.08); } }

  .frame { position: relative; background: #000; overflow: hidden; }

  .track { display: grid; grid-auto-flow: column; grid-auto-columns: 100%; overflow-x: auto; overscroll-behavior-x: contain; scroll-snap-type: x mandatory; scroll-behavior: smooth; scrollbar-width: none; }
  .track::-webkit-scrollbar { display: none; }
  .track.is-locked { overflow-x: hidden; }

  .slide { scroll-snap-align: start; position: relative; aspect-ratio: 4 / 5; overflow: hidden; background: #fff; margin: 0; }
  .slide img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }

  /* Intro: heart sign flickers on, the heart window opens on the title, then on the lineup */
  .intro { background: #000; cursor: pointer; }
  .intro .layer { transition: opacity .5s ease; }
  .intro .white { position: absolute; inset: 0; background: #fff; }
  .intro .mask { object-fit: cover; transform-origin: 50% 0; transition: transform 1s cubic-bezier(.55,0,.75,.4); will-change: transform; }
  .intro.is-open .mask { transform: scale(3.4); }
  .intro.is-done .mask { display: none; }
  .intro .lineup { object-position: 50% 50%; }
  .intro.is-done .lineup { animation: pan 16s ease-in-out 1s infinite alternate; }
  @keyframes pan { from { object-position: 50% 50%; } 25% { object-position: 0% 50%; } 75% { object-position: 100% 50%; } to { object-position: 50% 50%; } }
  .gone { opacity: 0 !important; }
  .skip { position: absolute; right: 10px; bottom: 10px; z-index: 5; border: 0; background: rgba(255,255,255,.18); color: #fff; font: 500 11px/1 "gotham", Helvetica, sans-serif; letter-spacing: .1em; text-transform: uppercase; padding: 8px 12px; border-radius: 999px; cursor: pointer; }
  .intro.is-done .skip { display: none; }

  .logo { position: absolute; top: 3.5%; right: 4%; width: 26%; max-width: 150px; height: auto; z-index: 4; opacity: 0; transition: opacity .4s ease; pointer-events: none; }
  .frame.is-live .logo { opacity: 1; }
  .frame.on-intro .logo { opacity: 0; }

  .arrow { position: absolute; top: 50%; transform: translateY(-50%); z-index: 6; width: 44px; height: 44px; border: 0; border-radius: 50%; background: rgba(255,255,255,.92); color: #111; font-size: 22px; cursor: pointer; box-shadow: 0 1px 6px rgba(0,0,0,.25); opacity: 0; pointer-events: none; transition: opacity .3s ease; display: none; }
  .frame.is-live .arrow { opacity: 1; pointer-events: auto; }
  .arrow.prev { left: 10px; } .arrow.next { right: 10px; }

  .bar { display: flex; justify-content: flex-end; align-items: center; height: 30px; background: #000; padding: 0 10px; }
  .bar img { height: 22px; width: auto; display: block; }

  .dots { display: flex; justify-content: center; gap: 8px; padding-top: 14px; }
  .dots button { width: 8px; height: 8px; padding: 0; border: 0; border-radius: 50%; background: #b5b5b5; cursor: pointer; }
  .dots button[aria-current="true"] { background: #111; width: 22px; border-radius: 4px; }
  .note { text-align: center; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: #666; margin: 10px 0 0; }
  .credit { text-align: center; font-size: 11px; color: #888; margin: 14px 16px 0; }

  /* Phone: each spread is shown as two single looks */
  .slide .look-b { display: none; }

  /* Tablet and desktop: original 743 x 450 spreads */
  @container (min-width: 700px) {
    .slide { aspect-ratio: 743 / 450; }
    .slide.half-b { display: none; }
    .intro .lineup, .intro.is-done .lineup { animation: none; object-position: 50% 50%; }
    .logo { width: 15.5%; top: 4.2%; right: 2%; }
    .arrow { display: block; }
    .note { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .track { scroll-behavior: auto; }
    .intro .layer, .intro .mask { transition: none; }
    .intro.is-done .lineup { animation: none; }
  }
</style>
</head>
<body>
<section class="lookbook" aria-label="Aéropostale Bethany Mota Collection lookbook">
  <div class="frame on-intro" id="frame">
    <img class="logo" src="img/logo.png" alt="Bethany Mota">
    <button class="arrow prev" aria-label="Previous">&#8249;</button>
    <div class="track is-locked" id="track">
      <figure class="slide intro" id="intro" aria-label="Introducing the Bethany Mota Collection">
        <img class="lineup" src="img/g_intro.lineup.jpg" alt="The Bethany Mota Collection lineup: six looks">
        <img class="layer title" src="img/g_intro.title.jpg" alt="Introducing the Bethany Mota Collection">
        <div class="layer white"></div>
        <img class="mask" src="img/intro.mask.png" alt="">
        <img class="layer heart-on" src="img/g_intro.heart_on.jpg" alt="">
        <img class="layer heart-off" src="img/g_intro.heart_off.jpg" alt="" style="transition:none">
        <button class="skip" id="skip">Skip intro</button>
      </figure>
    </div>
    <button class="arrow next" aria-label="Next">&#8250;</button>
  </div>
  <div class="bar"><img src="img/footer.aero.png" alt="Exclusively at Aéropostale"></div>
  <div class="dots" id="dots" aria-label="Choose a slide"></div>
  <p class="note">Swipe for more looks</p>
  <p class="credit">Creative and Art Direction by Rire Nakpodia. Originally designed and built for Aéropostale.</p>
</section>

<script>
  const frame = document.getElementById("frame");
  const track = document.getElementById("track");
  const intro = document.getElementById("intro");
  const dots = document.getElementById("dots");
  const $ = s => intro.querySelector(s);

  // Each original spread holds two looks. Wide screens show the spread; phones show each look on its own.
  const spreads = [
    { img: "g_slide1.img", a: "Floral skater dress with red tights; owl sweater with burgundy skirt" },
    { img: "g_slide2.img", a: "Black tunic with rose-print tights; burgundy lace top" },
    { img: "g_slide3.img", a: "Black peacoat with patterned leggings; white blazer with black skater skirt" }
  ];
  spreads.forEach((s, i) => {
    const [la, lb] = s.a.split("; ");
    for (const half of ["a", "b"]) {
      const f = document.createElement("figure");
      f.className = "slide" + (half === "b" ? " half-b" : " half-a");
      f.innerHTML = `<img src="img/${s.img}.jpg" data-alt="Look: ${half === "a" ? la : lb}" alt="Look: ${half === "a" ? la : lb}" style="object-position:${half === "a" ? "0%" : "100%"} 50%">`;
      track.appendChild(f);
    }
  });
  // On wide screens the "a" slide shows the whole spread
  const wide = () => track.clientWidth >= 700;
  function fitSpreads() {
    track.querySelectorAll(".half-a img").forEach(im => {
      im.style.objectPosition = wide() ? "50% 50%" : "0% 50%";
      im.alt = wide() ? "Two looks from the Bethany Mota Collection" : im.dataset.alt;
    });
  }

  const visible = () => [...track.children].filter(c => c.offsetParent !== null && getComputedStyle(c).display !== "none");
  function current() { return Math.round(track.scrollLeft / Math.max(1, track.clientWidth)); }
  function goTo(i) { const v = visible(); const n = v.length; i = (i + n) % n; track.scrollTo({ left: i * track.clientWidth, behavior: "smooth" }); }
  function buildDots() {
    fitSpreads();
    dots.innerHTML = "";
    visible().forEach((_, i) => {
      const b = document.createElement("button");
      b.setAttribute("aria-label", i === 0 ? "Intro" : "Slide " + (i + 1));
      b.addEventListener("click", () => { stopAuto(); goTo(i); });
      dots.appendChild(b);
    });
    sync();
  }
  function sync() {
    const p = current();
    [...dots.children].forEach((d, i) => d.setAttribute("aria-current", i === p));
    frame.classList.toggle("on-intro", p === 0);
  }
  track.addEventListener("scroll", () => requestAnimationFrame(sync), { passive: true });
  new ResizeObserver(buildDots).observe(track);

  // Auto-advance like the original (every 3.5s), stopping once someone takes over
  let auto = null;
  function startAuto() { if (!matchMedia("(prefers-reduced-motion: reduce)").matches) auto = setInterval(() => goTo(current() + 1), 3500); }
  function stopAuto() { clearInterval(auto); auto = null; }
  ["pointerdown", "wheel", "touchstart", "keydown"].forEach(ev => track.addEventListener(ev, stopAuto, { passive: true }));
  document.querySelector(".arrow.prev").addEventListener("click", () => { stopAuto(); goTo(current() - 1); });
  document.querySelector(".arrow.next").addEventListener("click", () => { stopAuto(); goTo(current() + 1); });
  document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stopAuto(); goTo(current() + 1); } if (e.key === "ArrowLeft") { stopAuto(); goTo(current() - 1); } });

  // Intro sequence
  const timers = [];
  const at = (ms, fn) => timers.push(setTimeout(fn, ms));
  let finished = false;
  function finish() {
    if (finished) return; finished = true;
    timers.forEach(clearTimeout);
    ["heart-off", "heart-on", "white", "title"].forEach(c => $("." + c).classList.add("gone"));
    intro.classList.add("is-open", "is-done");
    track.classList.remove("is-locked");
    frame.classList.add("is-live");
    startAuto();
  }
  function play() {
    const off = $(".heart-off");
    [300, 550, 800, 1050, 1300, 1550, 1800].forEach((t, i) => at(t, () => off.classList.toggle("gone", i % 2 === 0)));
    at(2200, () => $(".heart-on").classList.add("gone"));
    at(2950, () => $(".white").classList.add("gone"));
    at(4300, () => { $(".title").classList.add("gone"); intro.classList.add("is-open"); });
    at(5400, finish);
  }
  intro.addEventListener("click", () => { if (!finished) finish(); else { stopAuto(); goTo(1); } });
  document.getElementById("skip").addEventListener("click", e => { e.stopPropagation(); finish(); });

  const go = () => matchMedia("(prefers-reduced-motion: reduce)").matches ? finish() : play();
  if (document.readyState === "complete") go(); else window.addEventListener("load", go);

  const report = () => parent !== window && parent.postMessage({ type: "lookbook-height", height: document.documentElement.scrollHeight }, "*");
  new ResizeObserver(report).observe(document.body);
</script>
</body>
</html>
