<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aéropostale: Really Wear</title>
<!-- Gotham via Rire's Adobe Fonts web project "interact-responsive (Gotham)" -->
<link rel="stylesheet" href="https://use.typekit.net/sza7zys.css">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; background: #fff; }
  body { font-family: "gotham", Helvetica, Arial, sans-serif; color: #000; -webkit-font-smoothing: antialiased; }
  @media (min-width: 980px) { html, body { background: #f4f4f2; } body { padding: 40px 24px; } }

  .wrap { container-type: inline-size; width: 100%; max-width: 960px; margin: 0 auto; padding-bottom: 22px; background: #fff; }
  @media (min-width: 980px) { .wrap { padding: 24px 24px 22px; box-shadow: 0 2px 24px rgba(0,0,0,.08); } }
  .credit { text-align: center; font-size: 11px; color: #888; margin: 16px 16px 0; }

  .stage { position: relative; overflow: hidden; background: #00828c url(img/back.webp) center / cover no-repeat; }
  .toggle button { font-family: inherit; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: #000; background: #dcdf0c; border: 0; cursor: pointer; transition: background .2s, color .2s; }
  .toggle button[aria-pressed="true"] { background: #000; color: #fff; }
  .set { transition: opacity .45s ease; }
  .ph { position: relative; }
  .ph > img:not(.price) { display: block; width: 100%; height: 100%; object-fit: cover; }
  .price { position: absolute; z-index: 2; height: auto; }
  .tab { display: none; }

  /* ---------- Phone: title and toggle on top, then the collage stacked ---------- */
  .stage { padding: 22px 14px 16px; }
  .head { text-align: center; }
  .logo { display: block; width: 88%; max-width: 460px; height: auto; margin: 0 auto; }
  .toggle { display: flex; justify-content: center; gap: 10px; margin: 14px 0 18px; }
  .toggle button { min-width: 116px; height: 42px; font-size: 13px; }
  .frame { display: grid; grid-template-columns: minmax(0, 1fr); }
  .set { grid-area: 1 / 1; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
  .set:not(.on) { opacity: 0; visibility: hidden; }
  .ph.big { grid-column: 1 / 3; aspect-ratio: 1; }
  .ph.s1, .ph.s2 { aspect-ratio: 280 / 305; }
  .big .price { top: 3%; right: 3%; width: 32%; }
  .s2 .price { top: -9%; left: -12%; width: 62%; }

  /* ---------- Wider: the original spot ---------- */
  @container (min-width: 760px) {
    .stage { padding: 0; aspect-ratio: 1300 / 700; }
    .frame { position: absolute; left: 8.46%; top: 0; width: 83.08%; height: 100%; display: block; }
    .set { position: absolute; inset: 0; display: block; transition: transform .5s ease, opacity .5s ease; }
    .set:not(.on) { opacity: 1; visibility: visible; transform: translateX(var(--off, 110%)); }
    .ph { position: absolute; }
    .ph.big { left: 2.59%; top: 4.29%; width: 59.26%; height: 91.43%; aspect-ratio: auto; }
    .ph.s1 { left: 69.26%; top: 4.29%; width: 25.93%; height: 42.86%; aspect-ratio: auto; }
    .ph.s2 { left: 64.63%; top: 51.43%; width: 25.93%; height: 44.29%; aspect-ratio: auto; }
    .big .price { left: 105.3%; top: 8.9%; right: auto; width: 25%; }
    .s2 .price { left: 77.1%; top: 27.1%; right: auto; width: 57.1%; }
    .head { position: absolute; z-index: 3; left: 2.31%; top: 40.86%; width: 58.52%; }
    .logo { width: 100%; max-width: none; }
    .toggle { position: absolute; left: 0; top: 86.8%; width: 100%; margin: 0; display: block; }
    .toggle button { position: absolute; top: 0; width: 26.9%; height: auto; aspect-ratio: 170 / 45; min-width: 0; font-size: 1.05cqi; }
    .toggle button:first-child { left: 23.6%; } .toggle button:last-child { left: 52.1%; }
    .tab { display: block; position: absolute; z-index: 4; top: 1.14%; width: 8.46%; height: 100%; border: 0; padding: 0; cursor: pointer; background: left top / auto 100% no-repeat; transition: opacity .4s; }
    .tab.girl { left: 0; background-image: url(img/girl-toggle.jpg); }
    .tab.guy { right: 0; background-image: url(img/guy-toggle.jpg); }
    .tab[hidden] { display: block; opacity: 0; pointer-events: none; }
  }
  @media (prefers-reduced-motion: reduce) { .set { transition: none; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="stage">
    <div class="head">
      <h1 style="margin:0"><img class="logo" src="img/logo.webp" alt="Really Wear: for how you really live"></h1>
      <div class="toggle" role="group" aria-label="Show girls or guys">
        <button aria-pressed="true" data-k="girls">Girls</button><button aria-pressed="false" data-k="guys">Guys</button>
      </div>
    </div>
    <div class="frame">
      <div class="set on" data-k="girls">
        <div class="ph big"><img src="img/girls-big.jpg" alt="Girl in a light shirt holding a glass of juice"><img class="price" src="img/price-girls-tee.webp" alt="Tees starting at $6"></div>
        <div class="ph s1"><img src="img/girls-s1.jpg" alt="Girl in a striped tee against bamboo"></div>
        <div class="ph s2"><img src="img/girls-s2.jpg" alt="Girl in denim shorts and a bikini top at the beach"><img class="price" src="img/price-girls-shorts.webp" alt="Shorts starting at $24"></div>
      </div>
      <div class="set" data-k="guys">
        <div class="ph big"><img src="img/guys-big.jpg" alt="Guy in sunglasses and a printed shirt"><img class="price" src="img/price-guys-polo.webp" alt="Polos starting at $10"></div>
        <div class="ph s1"><img src="img/guys-s1.jpg" alt="Guy in a navy polo"></div>
        <div class="ph s2"><img src="img/guys-s2.jpg" alt="Guy in khaki shorts on a bike"><img class="price" src="img/price-guys-shorts.webp" alt="Shorts starting at $18"></div>
      </div>
    </div>
    <button class="tab girl" data-k="girls" aria-label="Show girls" hidden></button>
    <button class="tab guy" data-k="guys" aria-label="Show guys"></button>
  </div>
  <p class="credit">Creative and Art Direction by Rire Nakpodia. Originally designed and built for Aéropostale.</p>
</div>
<script>
  const sets = [...document.querySelectorAll(".set")], btns = [...document.querySelectorAll(".toggle button")], tabs = [...document.querySelectorAll(".tab")];
  let cur = "girls";
  function show(k) {
    cur = k;
    // the outgoing set slides off on the side it came from, like the original
    sets.forEach(s => { s.style.setProperty("--off", s.dataset.k === "girls" ? "-110%" : "110%"); s.classList.toggle("on", s.dataset.k === k); });
    btns.forEach(b => b.setAttribute("aria-pressed", b.dataset.k === k));
    tabs.forEach(t => t.hidden = t.dataset.k === k);
  }
  // Switches every 10 seconds, like the original, until someone takes over
  let timer = setInterval(() => show(cur === "girls" ? "guys" : "girls"), 10000);
  [...btns, ...tabs].forEach(b => b.addEventListener("click", () => { clearInterval(timer); show(b.dataset.k); }));
  btns.forEach(b => b.addEventListener("mouseenter", () => { if (matchMedia("(hover: hover)").matches) { clearInterval(timer); show(b.dataset.k); } }));
  show("girls");

  const report = () => parent !== window && parent.postMessage({ type: "lookbook-height", height: document.documentElement.scrollHeight }, "*");
  new ResizeObserver(report).observe(document.body);
</script>
</body>
</html>
